behaviors:
  SnowballTarget:
    trainer_type: ppo
    hyperparameters:
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      batch_size: 1024       # Increased for stability
      buffer_size: 10240     # Should be a multiple of batch_size
      beta: 5.0e-3           # Entropy: higher = more exploration
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true        # Set to true for complex vector observations
      hidden_units: 512      # Increased from 256 for more "brain" capacity
      num_layers: 3          # Added a 3rd layer for deeper reasoning
      vis_encode_type: resnet # Use 'resnet' instead of 'simple' if using visual inputs
      memory:                # Adds an LSTM so the agent can "remember" movements
        memory_size: 128
        sequence_length: 64
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:             # Encourages agent to visit new areas/states
        strength: 0.01
        gamma: 0.99
        encoding_size: 256
    keep_checkpoints: 10
    checkpoint_interval: 50000
    max_steps: 1000000       # Increased: deeper models need more time to learn
    time_horizon: 128        # Longer "memory" for awarding rewards
    summary_freq: 10000