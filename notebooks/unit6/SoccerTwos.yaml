default_settings: null

behaviors:
  SoccerTwos:
    trainer_type: poca
    
    # --- Training Parameters ---
    hyperparameters:
      batch_size: 4096
      buffer_size: 40960
      learning_rate: 0.0002
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant
    
    # --- Neural Network Architecture ---
    network_settings:
      normalize: false
      hidden_units: 1024
      num_layers: 3
      vis_encode_type: simple
      memory: null
      goal_conditioning_type: hyper
      deterministic: false

    # --- Reward Structure ---
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
        network_settings:
          normalize: false
          hidden_units: 128
          num_layers: 2
          vis_encode_type: simple

    # --- Self-Play Settings ---
    self_play:
      save_steps: 50000
      team_change: 200000
      swap_steps: 2000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0

    # --- Global Trainer Settings ---
    max_steps: 15000000
    time_horizon: 1000
    summary_freq: 10000
    keep_checkpoints: 5
    checkpoint_interval: 500000
    threaded: false

# --- Engine & Environment Settings ---
env_settings:
  env_path: "./training-envs-executables/linux/SoccerTwos/SoccerTwos.app"
  num_envs: 1
  num_areas: 1
  base_port: 5005
  seed: -1

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  no_graphics: true

checkpoint_settings:
  run_id: "SoccerTwos"
  resume: true
  results_dir: "results"